{{- if .Values.acm.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.acm.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.acm.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: acm
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        acm-operator:
          subscription:
            source: {{ include "app-of-apps.operatorSource" . }}
        acm-instance:
          localClusterName: {{ .Values.acm.localClusterName }}
          availabilityConfig: {{ .Values.acm.availabilityConfig }}
          imagePullSecret: {{ .Values.acm.imagePullSecret }}
          separateCertificateManagement: {{ .Values.acm.separateCertificateManagement }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
